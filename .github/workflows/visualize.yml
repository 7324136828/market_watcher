name: Build dashboard

# On every push to main (including PR merges), build the HTML dashboards and
# PNG overviews from data/*.csv plus the weekly Market Update PDF, and upload
# them as one workflow artifact. The PDF is not committed to the repository;
# this artifact is where it is published.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      fresh_market_update:
        description: "Build a new Market Update from live prices and news instead of typesetting the latest committed issue"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow (PNG chart)
        run: pip install pillow

      - name: Generate dashboard
        run: |
          mkdir -p dist
          python3 scripts/visualize_data.py \
            --html dist/dashboard.html \
            --png dist/data_overview.png
          python3 scripts/visualize_asset_classes.py --quiet \
            --html dist/asset_classes_dashboard.html \
            --png dist/asset_classes_overview.png
          python3 scripts/visualize_goods_drugs_housing.py --quiet \
            --html dist/goods_drugs_housing_dashboard.html \
            --png dist/goods_drugs_housing_overview.png

      # By default the latest committed issue (reports/market-update-*.md) is
      # typeset, so the PDF always matches the Markdown in the repository.
      # A manual run with "fresh_market_update" fetches prices and news instead.
      - name: Build Market Update PDF
        env:
          FRESH: ${{ inputs.fresh_market_update }}
        run: |
          mkdir -p dist
          if [ "$FRESH" = "true" ]; then
            python3 scripts/build_market_update.py --out-dir dist
          else
            latest=$(ls reports/market-update-*.md | sort | tail -n 1)
            python3 scripts/build_market_update.py --from-markdown "$latest" --out-dir dist
          fi

      - name: Upload dashboard artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-dashboard-${{ github.sha }}
          path: |
            dist/dashboard.html
            dist/data_overview.png
            dist/asset_classes_dashboard.html
            dist/asset_classes_overview.png
            dist/goods_drugs_housing_dashboard.html
            dist/goods_drugs_housing_overview.png
            dist/market-update-*.pdf
            dist/market-update-*.md
          if-no-files-found: error
          retention-days: 30
